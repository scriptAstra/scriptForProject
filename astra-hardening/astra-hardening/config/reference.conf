MODULES="network time ssh password audit users access integrity kernel"
ENABLE_RISKY=no

WHEEL_USERS=()
SUDO_RULES=()
SUID_WHITELIST="$BASE_DIR/config/suid.whitelist"
SYS_BIN_DIRS=(/bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin /lib /lib64 /usr/lib /usr/lib64)
SYSCTL_FILE=/etc/sysctl.d/99-astra-hardening.conf
GRUB_FILE=/etc/default/grub

SYSCTL_REQS=(
    "2.4.1|kernel.dmesg_restrict|1|"
    "2.4.2|kernel.kptr_restrict|2|"
    "2.4.8|net.core.bpf_jit_harden|2|"
    "2.5.2|kernel.perf_event_paranoid|3|"
    "2.5.4|kernel.kexec_load_disabled|1|"
    "2.5.5|user.max_user_namespaces|0|risky"
    "2.5.6|kernel.unprivileged_bpf_disabled|1|risky"
    "2.5.7|vm.unprivileged_userfaultfd|0|"
    "2.5.8|dev.tty.ldisc_autoload|0|"
    "2.5.10|vm.mmap_min_addr|>=4096|"
    "2.5.11|kernel.randomize_va_space|2|"
    "2.6.1|kernel.yama.ptrace_scope|3|risky"
    "2.6.2|fs.protected_symlinks|1|"
    "2.6.3|fs.protected_hardlinks|1|"
    "2.6.4|fs.protected_fifos|2|"
    "2.6.5|fs.protected_regular|2|"
    "2.6.6|fs.suid_dumpable|0|"
)

BOOT_REQS=(
    "2.4.3|init_on_alloc=1|"
    "2.4.4|slab_nomerge|"
    "2.4.5(а)|iommu=force|"
    "2.4.5(б)|iommu.strict=1|"
    "2.4.5(в)|iommu.passthrough=0|"
    "2.4.6|randomize_kstack_offset=1|"
    "2.4.7|mitigations=auto,nosmt|x86"
    "2.5.1|vsyscall=none|x86"
    "2.5.3|debugfs=no-mount|"
    "2.5.9|tsx=off|x86"
)
